name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    env:
      # Browsers are only needed by the canvas E2E job.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint (CLI + canvas type-check)
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Build (tsc + vite canvas bundle)
        run: npm run build
      - name: Pack + clean-install smoke (help, init, index, check, export, doctor, canvas)
        run: node .github/scripts/pack-smoke.mjs

  canvas-e2e:
    name: Canvas E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run canvas E2E scenarios
        run: npm run test:canvas:e2e
